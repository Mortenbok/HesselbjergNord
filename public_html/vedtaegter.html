<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedtægter — Hesselbjerg Nord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: url('vedtaegter.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
  }

  nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 2;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px 15px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
  }

  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 20px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    transition: background 0.25s ease;
  }

  nav a:hover,
  nav a.active {
    background: rgba(255,255,255,0.18);
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 40px 30px;
    max-width: 600px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    margin-bottom: 15px;
  }

  p.subtitle {
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    margin-bottom: 30px;
    font-weight: 300;
  }

  .badge {
    display: inline-block;
    padding: 10px 24px;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 30px;
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
    background: rgba(255,255,255,0.08);
  }

  footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 1;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <nav>
    <a href="omraade.html">Område</a>
    <a href="vedtaegter.html" class="active">Vedtægter</a>
    <a href="bestyrelsen.html">Bestyrelsen</a>
    <a href="kontingent.html">Kontingent</a>
    <a href="aktiviteter.html">Aktiviteter</a>
  </nav>

  <div class="content">
    <h1>Vedtægter</h1>
    <p class="subtitle">Siden er under opbygning<br>Kom snart tilbage</p>
    <span class="badge">Under opbygning</span>
  </div>
  <footer>&copy; 2026 Hesselbjerg Nord</footer>
</body>
</html>
