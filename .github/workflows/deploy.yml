# Lægger public_html/ op på webhotellet hos Simply.com.
#
# ---------------------------------------------------------------------------
# SÅDAN VIRKER DEN
# ---------------------------------------------------------------------------
# AUTOMATISK: hver gang der pushes til main, bliver ændringerne lagt op med
# det samme. Der skal ikke trykkes på noget.
#
# I HÅNDEN: fanen "Actions" → "Deploy til hesselbjergnord.dk" → "Run workflow".
# Her kan du vælge "Kun prøvekørsel", som skriver i loggen, hvad den VILLE
# gøre, uden at røre serveren. Brug den, hvis du er i tvivl.
#
# ---------------------------------------------------------------------------
# HUSK
# ---------------------------------------------------------------------------
# Alt, hvad du pusher til main, er live umiddelbart efter. Er en ændring ikke
# færdig, så lad være med at pushe den til main — eller sæt push-udløseren
# nedenfor til igen ved at skrive # foran de to linjer under "push:".
#
# Secrets, der skal være på plads (Settings → Secrets and variables → Actions):
#   FTP_SERVER   serveradressen, fx ftp.simply.com
#   FTP_USER     FTP-brugernavnet
#   FTP_PASS     adgangskoden
# ---------------------------------------------------------------------------

name: Deploy til hesselbjergnord.dk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kun prøvekørsel (rører ikke serveren)"
        type: boolean
        default: true
      protocol:
        description: "Forbindelsestype"
        type: choice
        default: ftps
        options: [ftps, ftp, sftp]

# To udgivelser må ikke køre oven i hinanden og skrive i de samme filer.
# En igangværende kørsel får lov at gøre sig færdig; den næste venter.
concurrency:
  group: deploy-hesselbjergnord
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Læg public_html op på serveren
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: ${{ inputs.protocol == 'sftp' && 22 || 21 }}

          local-dir: ./public_html/
          server-dir: /public_html/

          # Prøvekørsel kan KUN vælges, når den startes i hånden.
          # Et push skal altid lægge tingene rigtigt op.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

          # Sletter ALDRIG filer på serveren, der ikke findes i git.
          # Det er ikke en detalje: medlemmernes billeder i uploads/ og
          # adgangskoderne i includes/config.local.php findes KUN på
          # serveren, og en oprydning ville fjerne dem for altid.
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            uploads/**
            bestyrelse/**
            includes/config.local.php
