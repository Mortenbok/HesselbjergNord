<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hesselbjerg Nord</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f3efe8;
        color: #1f2937;
      }
      .card {
        background: #fff;
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.2rem;
      }
      p {
        margin: 0;
        color: #4b5563;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hesselbjerg Nord</h1>
      <p>Website content ready for deployment.</p>
    </div>
  </body>
</html>
